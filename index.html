<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>លិខិតអញ្ជើញអាពាហ៍ពិពាហ៍</title>
  <link rel="icon" href="favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600&family=Moul&family=Preahvihear&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#3a0f1a; --surface:#4b1624; --gold:#d9b25e; --text:#f7efe0;
      --muted:color-mix(in srgb,var(--text) 72%,transparent);
      --line:color-mix(in srgb,var(--gold) 45%,transparent);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:var(--bg);color:var(--text);
      font-family:'Kantumruy Pro','Khmer OS Battambang',sans-serif;
      line-height:1.9;font-size:17px;
      padding-bottom:env(safe-area-inset-bottom,0);
    }
    section{max-width:640px;margin:0 auto;padding:64px 24px;text-align:center}
    .rule{height:1px;background:var(--line);max-width:640px;margin:0 auto}
    h1,h2,.names{font-family:'Moul',serif;font-weight:400;color:var(--gold)}
    h2{font-size:1.2rem;margin-bottom:24px;line-height:1.8}
    p{color:var(--muted)}

    /* hero */
    .hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;
      padding-top:max(64px,env(safe-area-inset-top));
      background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 60%)}
    .hero .small{font-family:'Preahvihear',serif;color:var(--gold);font-size:1.05rem}
    .photo{width:170px;height:170px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);
      outline:6px solid var(--bg);box-shadow:0 0 0 7px var(--line);margin:28px 0 8px}
    .names{font-size:clamp(2.2rem,11vw,3.6rem);line-height:1.5;margin:20px 0}
    .names .and{display:block;font-family:'Preahvihear',serif;font-size:1.3rem;color:var(--text);margin:2px 0}
    .guest{margin-top:8px;font-size:1.05rem;color:var(--text)}
    .guest b{color:var(--gold);font-weight:600}
    .date-big{font-family:'Preahvihear',serif;font-size:1.15rem;color:var(--text);margin-top:12px}
    .hint{margin-top:36px;color:var(--gold);font-size:.9rem;animation:bob 2.4s ease-in-out infinite}
    @keyframes bob{50%{transform:translateY(6px)}}
    .hero > *{animation:rise .9s both}
    .hero > *:nth-child(2){animation-delay:.12s}.hero > *:nth-child(3){animation-delay:.24s}
    .hero > *:nth-child(4){animation-delay:.36s}.hero > *:nth-child(5){animation-delay:.48s}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}}

    /* parents */
    .parents{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
    .parents div{border:1px solid var(--line);background:var(--surface);padding:20px 12px}
    .parents h3{font-family:'Preahvihear',serif;font-weight:400;color:var(--gold);margin-bottom:6px}
    .parents p{line-height:1.7}

    /* date + venue */
    .when{font-family:'Preahvihear',serif;font-size:1.25rem;color:var(--text)}
    .venue{margin:20px 0 8px;font-weight:600;color:var(--text);font-size:1.15rem}
    .btn{display:inline-block;margin-top:22px;padding:12px 28px;border:1px solid var(--gold);color:var(--gold);
      text-decoration:none;font-family:inherit;font-size:1rem;background:none;cursor:pointer;transition:background .2s,color .2s}
    .btn:hover,.btn:focus-visible{background:var(--gold);color:var(--bg);outline:none}

    /* countdown */
    .count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
    .count div{background:var(--surface);border:1px solid var(--line);padding:16px 4px}
    .count b{display:block;font-family:'Moul',serif;font-weight:400;font-size:1.7rem;color:var(--gold);line-height:1.5}
    .count span{font-size:.9rem;color:var(--muted)}
    .done{font-family:'Moul',serif;color:var(--gold);font-size:1.1rem;line-height:2}

    /* schedule */
    .sched{list-style:none;text-align:left;max-width:460px;margin:0 auto}
    .sched li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
    .sched li:last-child{border-bottom:0}
    .sched time{font-family:'Preahvihear',serif;color:var(--gold)}
    .sched span{color:var(--text)}

    /* contacts */
    .contacts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
    .contacts a{display:block;min-width:200px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);
      color:var(--text);text-decoration:none}
    .contacts a small{display:block;color:var(--muted);font-size:.9rem}
    .contacts a b{color:var(--gold);font-weight:600;font-size:1.15rem}
    footer{padding:40px 24px calc(90px + env(safe-area-inset-bottom,0));text-align:center;color:var(--muted);font-size:.9rem}

    /* music */
    #music{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));width:48px;height:48px;border-radius:50%;
      border:1px solid var(--gold);background:var(--surface);color:var(--gold);font-size:20px;cursor:pointer;z-index:10}
    #music:focus-visible{outline:2px solid var(--text);outline-offset:3px}
    #music.on{animation:spin 6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    [hidden]{display:none!important}

    @media (max-width:480px){
      .parents{grid-template-columns:1fr}
      .count b{font-size:1.35rem}
      .sched li{grid-template-columns:90px 1fr;gap:10px}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
  </style>
</head>
<body>
  <main id="app"></main>
  <button id="music" aria-label="បើក/បិទតន្ត្រី" hidden>♪</button>
  <audio id="audio" loop preload="none"></audio>

  <script src="config.js"></script>
  <script>
  (function(){
    var C = window.WEDDING || {};
    var $ = function(s){return document.querySelector(s)};
    var esc = function(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML};
    var kh = function(n){return String(n).replace(/\d/g,function(d){return '០១២៣៤៥៦៧៨៩'[d]})};

    // colors
    var col = C.colors || {}, r = document.documentElement.style;
    if(col.background) r.setProperty('--bg',col.background);
    if(col.surface)    r.setProperty('--surface',col.surface);
    if(col.gold)       r.setProperty('--gold',col.gold);
    if(col.text)       r.setProperty('--text',col.text);
    if(C.pageTitle) document.title = C.pageTitle;

    // guest name from link: ?to=ឈ្មោះភ្ញៀវ
    var guest = new URLSearchParams(location.search).get('to');

    var parents = function(title, arr){
      return '<div><h3>'+esc(title)+'</h3>'+(arr||[]).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div>';
    };

    var html = '';
    html += '<section class="hero">'
      + '<p class="small">'+esc(C.headline)+'</p>'
      + (C.photo ? '<img class="photo" src="'+esc(C.photo)+'" alt="">' : '')
      + '<h1 class="names">'+esc(C.groom)+'<span class="and">និង</span>'+esc(C.bride)+'</h1>'
      + '<p class="date-big">'+esc(C.dateText)+'</p>'
      + (guest ? '<p class="guest">សូមគោរពអញ្ជើញ <b>'+esc(guest)+'</b></p>' : '')
      + '<p class="hint">រំកិលចុះក្រោម ↓</p></section>';

    html += '<div class="rule"></div><section><h2>សេចក្តីអញ្ជើញ</h2>'
      + '<p>'+esc(C.invitationText)+'</p><div style="height:28px"></div>'
      + '<div class="parents">'+parents('ខាងកូនកំលោះ',C.groomParents)+parents('ខាងកូនក្រមុំ',C.brideParents)+'</div></section>';

    html += '<div class="rule"></div><section><h2>ថ្ងៃ និងទីកន្លែង</h2>'
      + '<p class="when">'+esc(C.dateText)+'</p>'
      + (C.lunarText ? '<p>'+esc(C.lunarText)+'</p>' : '')
      + '<p class="venue">'+esc(C.venueName)+'</p><p>'+esc(C.venueAddress)+'</p>'
      + (C.mapLink ? '<a class="btn" href="'+esc(C.mapLink)+'" target="_blank" rel="noopener">មើលផែនទី</a>' : '')
      + '</section>';

    html += '<div class="rule"></div><section><h2>រាប់ថយក្រោយ</h2><div id="count"></div></section>';

    if(C.schedule && C.schedule.length){
      html += '<div class="rule"></div><section><h2>កម្មវិធី</h2><ul class="sched">'
        + C.schedule.map(function(s){return '<li><time>'+esc(s.time)+'</time><span>'+esc(s.title)+'</span></li>'}).join('')
        + '</ul></section>';
    }

    if(C.contacts && C.contacts.length){
      html += '<div class="rule"></div><section><h2>ទំនាក់ទំនង</h2><div class="contacts">'
        + C.contacts.map(function(c){
            return '<a href="tel:'+esc(String(c.phone).replace(/\s/g,''))+'"><small>'+esc(c.label)+'</small><b>'+esc(c.phone)+'</b></a>';
          }).join('')
        + '</div><p style="margin-top:28px">'+esc(C.closingText)+'</p></section>';
    }

    html += '<footer>'+esc(C.groom)+' & '+esc(C.bride)+'</footer>';
    $('#app').innerHTML = html;

    // countdown
    var target = new Date(C.dateTime).getTime(), box = $('#count');
    function tick(){
      var d = target - Date.now();
      if(isNaN(target)){box.innerHTML='';return}
      if(d <= 0){box.innerHTML='<p class="done">'+esc(C.countdownDone)+'</p>';return}
      var days=Math.floor(d/864e5), h=Math.floor(d%864e5/36e5), m=Math.floor(d%36e5/6e4), s=Math.floor(d%6e4/1e3);
      box.innerHTML='<div class="count">'
        +[[days,'ថ្ងៃ'],[h,'ម៉ោង'],[m,'នាទី'],[s,'វិនាទី']].map(function(x){return '<div><b>'+kh(x[0])+'</b><span>'+x[1]+'</span></div>'}).join('')
        +'</div>';
    }
    tick(); setInterval(tick,1000);

    // music
    var audio=$('#audio'), btn=$('#music');
    if(C.music){
      audio.src=C.music; btn.hidden=false;
      var play=function(){audio.play().then(function(){btn.classList.add('on')}).catch(function(){})};
      btn.addEventListener('click',function(){
        if(audio.paused){play()}else{audio.pause();btn.classList.remove('on')}
      });
      if(C.musicAutoplay){
        var first=function(e){
          document.removeEventListener('pointerdown',first);
          if(e.target.closest('#music'))return;
          play();
        };
        document.addEventListener('pointerdown',first);
      }
    }
  })();
  </script>
</body>
</html>
